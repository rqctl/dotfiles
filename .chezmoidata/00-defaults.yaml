# Generic defaults so the repo carries no employer-identifying data.
# Real values go under [data.org] in ~/.config/chezmoi/chezmoi.toml, which
# overrides any key below. See docs/chezmoi.toml.example.
org:
  gitlabHost: gitlab.example.com
  vpnOrg: ""
  awsProfile: default
  gcpQuotaProject: ""
  gcpProjectFilter: ""
  ghorgOrgs: ""
  debugImage: busybox:latest
  vault:
    addrs: []
    authPath: oidc
    authRole: default
  nimbus:
    lockBucket: ""       # GCS bucket for nimbus run locks
    lockProject: ""
  claude:
    marketplace: ""      # Claude Code plugin marketplace, rendered only when set
    marketplaceUrl: ""
    plugins: {}          # plugin name -> enabled, from that marketplace
