# Only non-mutating checks here: chezmoi source files must stay byte-identical to
# what they deploy, so formatters like end-of-file-fixer would corrupt the targets.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.29.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: private-values
        name: no values from chezmoi.toml [data]
        entry: ./.check-private-values.sh
        language: system
        pass_filenames: false
        always_run: true
